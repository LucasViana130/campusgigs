server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campusgigs-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusgigs}
    username: ${DB_USER:campusgigs}
    password: ${DB_PASSWORD:campusgigs}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # O schema é controlado pelo Flyway, não pelo Hibernate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  # Decisao de implementacao: chave lida de variavel de ambiente; o valor
  # abaixo e apenas um default de DESENVOLVIMENTO (nunca usar em producao).
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

cep:
  # Decisao de implementacao: nenhuma API de CEP foi definida previamente no
  # projeto, entao foi usado o ViaCEP (publico e gratuito) como implementacao
  # de referencia, consumido via cliente declarativo Spring HttpExchange.
  api:
    base-url: ${CEP_API_BASE_URL:https://viacep.com.br}
  connect-timeout-ms: ${CEP_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${CEP_READ_TIMEOUT_MS:3000}
